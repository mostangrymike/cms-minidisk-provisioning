name: evidence CI
on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip
      - name: Run unit tests
        run: python -m unittest discover -v
